# TestGrid local environment — PRD-01 `default` services, plus RabbitMQ from PRD-04
# (CONFLICT_REGISTER N14: dispatch needs the broker, so it is in the default profile).
# Run through the root Makefile (make up / down / reset / logs). Every published port
# binds to 127.0.0.1 only. Resource limits follow docs/VERSIONS.md §3.
name: testgrid

x-hardening: &hardening
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testgrid}
      POSTGRES_USER: ${POSTGRES_USER:-testgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    # Postgres needs a few capabilities to chown its data dir on first start,
    # so it gets no-new-privileges but not cap_drop: ALL. Hardened in PRD-12.
    security_opt: ['no-new-privileges:true']
    networks: [internal]
    mem_limit: 512m
    cpus: 1.0

  rabbitmq:
    image: rabbitmq:4.4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-testgrid}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (copy .env.example)}
    volumes:
      # Quorum queues and their messages survive `make down` / a broker restart (PRD-04 AC-5).
      - mqdata:/var/lib/rabbitmq
    # A fixed node name keeps the data directory valid across container re-creation.
    hostname: rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    # The broker drops privileges itself on start, like postgres; hardened in PRD-12.
    security_opt: ['no-new-privileges:true']
    # Internal only: no published ports (the management UI is reachable with `docker exec`).
    networks: [internal]
    mem_limit: 512m
    cpus: 1.0

  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    image: testgrid/api:dev
    environment:
      API_PORT: '8080'
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=75'
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-testgrid}
      DB_USER: ${POSTGRES_USER:-testgrid}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      # Safe default: fixture modes are refused unless .env says exactly "local".
      TESTGRID_PROFILE: ${TESTGRID_PROFILE:-}
      # Worker API (PRD-03 FR-2): its own port, reachable only inside Compose; never published.
      TESTGRID_INTERNAL_PORT: '8081'
      TESTGRID_WORKER_TOKEN: ${TESTGRID_WORKER_TOKEN:?set TESTGRID_WORKER_TOKEN in .env (copy .env.example)}
      # PRD-04 outbox publisher and topology.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-testgrid}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (copy .env.example)}
      # PRD-04 reaper timings (docs/RUNBOOK.md §2); scripts/stuck-runs.sh reads the same values.
      TESTGRID_REAPER_INTERVAL_MS: ${TESTGRID_REAPER_INTERVAL_MS:-5000}
      TESTGRID_RETRY_BACKOFF_BASE_MS: ${TESTGRID_RETRY_BACKOFF_BASE_MS:-2000}
      TESTGRID_RETRY_BACKOFF_MAX_MS: ${TESTGRID_RETRY_BACKOFF_MAX_MS:-60000}
      TESTGRID_DISPATCH_TIMEOUT_MS: ${TESTGRID_DISPATCH_TIMEOUT_MS:-300000}
      # PRD-06 artifact store (ADR-005); the volume keeps artifacts across `make down`.
      TESTGRID_ARTIFACT_ROOT: /var/lib/testgrid/artifacts
    volumes:
      - artifacts:/var/lib/testgrid/artifacts
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/healthz']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    <<: *hardening
    networks: [edge, internal]
    mem_limit: 768m
    cpus: 1.5

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    image: testgrid/web:dev
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/healthz']
      interval: 3s
      timeout: 3s
      retries: 20
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    networks: [edge]
    mem_limit: 256m
    cpus: 0.5

  demo-shop:
    build:
      context: ../..
      dockerfile: demo-shop/Dockerfile
    image: testgrid/demo-shop:dev
    environment:
      # Safe default: fixtures are off unless .env says exactly "enabled".
      DEMO_SHOP_FIXTURES: ${DEMO_SHOP_FIXTURES:-disabled}
    ports:
      # Loopback only, for the host-side `make smoke`, `make fixture-checks` and `make modes`
      # (CONFLICT_REGISTER N9). The worker reaches the shop over `internal`, not this port.
      - '127.0.0.1:${DEMO_SHOP_PORT:-4173}:4173'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    networks: [internal, edge]
    mem_limit: 256m
    cpus: 0.5

  worker:
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    image: testgrid/worker:dev
    environment:
      TESTGRID_API_URL: http://api:8081
      TESTGRID_WORKER_TOKEN: ${TESTGRID_WORKER_TOKEN:?set TESTGRID_WORKER_TOKEN in .env (copy .env.example)}
      # No fixed TESTGRID_WORKER_ID (CONFLICT_REGISTER N13): each container is worker-<hostname>,
      # so `--scale worker=N` gives N distinct names in the registry and on attempts.
      TESTGRID_WORKER_ENGINES: ${TESTGRID_WORKER_ENGINES:-chromium}
      # PRD-04 FR-5: dispatch messages come from the broker; prefetch = slots.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-testgrid}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (copy .env.example)}
      TESTGRID_WORKER_SLOTS: ${TESTGRID_WORKER_SLOTS:-1}
      # PRD-04 Verification fault points (scripts/crash-check.sh). Its own variable, so arming the
      # worker never arms the API; refused unless TESTGRID_PROFILE=local.
      TG_FAULT: ${TG_FAULT_WORKER:-}
      TESTGRID_PROFILE: ${TESTGRID_PROFILE:-}
      # The allowlisted origin behind the manifest's baseUrlRef DEMO_SHOP_INTERNAL.
      DEMO_SHOP_INTERNAL: http://demo-shop:4173
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      demo-shop:
        condition: service_healthy
    # tini as PID 1 reaps orphaned browser processes and forwards SIGTERM to the worker.
    init: true
    # FR-6: 20 s for the current attempt, 10 s SIGTERM→SIGKILL on Playwright, then margin.
    stop_grace_period: 40s
    <<: *hardening
    read_only: true
    # The root filesystem is read-only; browsers write profiles under HOME (Firefox refuses
    # to start without a writable one), so HOME is a tmpfs owned by pwuser (uid 1001).
    tmpfs:
      - /tmp
      - /home/pwuser:uid=1001,gid=1001,mode=0700
    shm_size: 512m
    # Internal network only: the worker reaches the API's worker port and the demo-shop.
    networks: [internal]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 512

networks:
  edge: {}
  internal:
    internal: true

volumes:
  pgdata: {}
  mqdata: {}
  artifacts: {}
