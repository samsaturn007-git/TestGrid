server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # The dashboard calls the API on its own origin (PRD-05), so the API needs no CORS.
    location /api/ {
        proxy_pass http://api:8080;
    # A stopped API answers 502 within 5 s instead of holding requests for nginx's default 60 s,
    # so the dashboard's live-update fallback (PRD-05 FR-3) and error states show promptly.
    proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
