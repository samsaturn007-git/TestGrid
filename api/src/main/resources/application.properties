spring.application.name=testgrid-api
server.port=${API_PORT:8080}
server.shutdown=graceful
spring.main.banner-mode=off
# No Whitelabel HTML page; errors stay JSON.
server.error.whitelabel.enabled=false
# PostgreSQL (PRD-02). Compose passes these; tests use Testcontainers @ServiceConnection.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/testgrid}
spring.datasource.username=${DB_USER:testgrid}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
# Worker directory holding manifest/suites.json and the spec files it lists (PRD-02 FR-2).
# The API image sets TESTGRID_MANIFEST_ROOT=/app/worker; Maven runs from api/.
testgrid.manifest.root=${TESTGRID_MANIFEST_ROOT:../worker}
# Only "local" unlocks fixture modes (PRD-02 FR-4). Unset = not local, the safe default.
testgrid.profile=${TESTGRID_PROFILE:}
# PRD-03 FR-8: one JSON object per line. MDC keys (traceId, requestId and, on worker calls,
# runId, targetId, attemptId, workerId) become top-level fields. Tokens are never logged.
logging.structured.format.console=logstash
# Errors that escape the MVC advice (e.g. inside a filter) never include internals.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
# OpenAPI (PRD-02 FR-9): only the public API, deterministic output for the drift check.
springdoc.paths-to-match=/api/**
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
springdoc.override-with-generic-response=false
# Worker API (PRD-03 FR-2): a second port, opened only when TESTGRID_WORKER_TOKEN is set.
testgrid.internal.port=${TESTGRID_INTERNAL_PORT:8081}
testgrid.internal.worker-token=${TESTGRID_WORKER_TOKEN:}
# PRD-04: first-start values for the scheduler_settings row (CONFLICT_REGISTER N15). After the
# row exists the database is the only source; these are not re-applied.
testgrid.scheduler.global-max-sessions=${TESTGRID_GLOBAL_MAX_SESSIONS:3}
testgrid.scheduler.max-attempts=${TESTGRID_MAX_ATTEMPTS:3}
testgrid.scheduler.lease-ttl-seconds=${TESTGRID_LEASE_TTL_SECONDS:30}
# PRD-04 dispatcher and outbox publisher (ARCHITECTURE §6 defaults). TESTGRID_DISPATCH_ENABLED=false
# stops both loops; nothing is then released to the broker.
testgrid.dispatch.enabled=${TESTGRID_DISPATCH_ENABLED:true}
testgrid.dispatch.tick-ms=250
testgrid.dispatch.outbox-poll-ms=500
testgrid.dispatch.outbox-batch-size=100
testgrid.dispatch.confirm-timeout-ms=5000
# Test-only failure points (PRD-04 Verification); honoured only with TESTGRID_PROFILE=local.
testgrid.fault=${TG_FAULT:}
# RabbitMQ (PRD-04). Compose sets these; tests use Testcontainers @ServiceConnection.
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:testgrid}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.connection-timeout=5s
# Publisher confirms + returns: the outbox marks a row published only after the broker acked it
# and routed it to a queue (FR-3).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
