# Test-only overrides (classpath:/config/ wins over classpath:/application.properties).
# The background dispatch loops would race with tests that assert exact events and versions;
# dispatch tests call Dispatcher / OutboxPublisher directly, and DispatchLoopTest turns them on.
testgrid.dispatch.enabled=false
# PRD-06 FR-6: retention tests call ArtifactRetention directly.
testgrid.artifacts.retention-enabled=false
