openapi: 3.1.0
info:
  description: "Public API (/api/v1). Vocabulary: docs/API_AND_DATA_CONTRACTS.md.\
    \ Errors are RFC 9457 Problem Details."
  title: TestGrid API
  version: v1
servers:
- url: /
paths:
  /api/v1/artifacts/{artifactId}:
    get:
      description: "state is EXPIRED once expires_at has passed, even before the hourly\
        \ purge marks the row. The storage key is never returned."
      operationId: getArtifact
      parameters:
      - in: path
        name: artifactId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactView"
          description: The artifact
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found
      summary: Artifact metadata
      tags:
      - artifacts
  /api/v1/artifacts/{artifactId}/content:
    get:
      description: "Content-Disposition: attachment, X-Content-Type-Options: nosniff,\
        \ a CSP that allows nothing to run, Cache-Control: private, no-store. An <img>\
        \ still shows a screenshot; navigating to the URL downloads it."
      operationId: getArtifactContent
      parameters:
      - in: path
        name: artifactId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Epoch seconds, from the link"
        in: query
        name: expires
        required: false
        schema:
          type: string
      - description: "Signature, from the link"
        in: query
        name: sig
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/zip:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
          description: "The bytes, with the artifact's stored type"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: validation-failed (unknown query parameter)
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "forbidden (missing, forged or expired link)"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: artifact-expired
      summary: Stream the bytes through a signed link
      tags:
      - artifacts
  /api/v1/artifacts/{artifactId}/links:
    post:
      description: "url is relative to the API origin and carries expires (epoch seconds)\
        \ and sig (HMAC-SHA256 of the artifact ID and expiry). It is the only way\
        \ to read the content. Not access control: until PRD-12 anyone who reaches\
        \ the API can ask."
      operationId: createArtifactLink
      parameters:
      - in: path
        name: artifactId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
          description: The link
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "not-found (unknown, or the bytes are MISSING)"
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: artifact-expired
      summary: "A signed content link, valid for at most 5 minutes"
      tags:
      - artifacts
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
          description: Capabilities
      summary: What this deployment accepts
      tags:
      - meta
  /api/v1/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProject"
          description: Projects
      summary: Projects the caller can see
      tags:
      - catalog
  /api/v1/projects/{projectId}/run-counts:
    get:
      description: "Every RunStatus is listed, zeros included, in the contract's order."
      operationId: countRuns
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - description: "1-168, default 24"
        in: query
        name: hours
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCounts"
          description: The counts
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: validation-failed (hours outside 1-168)
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found
      summary: "Runs queued in the last N hours, by current status"
      tags:
      - runs
  /api/v1/projects/{projectId}/runs:
    post:
      operationId: createRun
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: "Replay: this key was already used with the same request"
          headers:
            Idempotent-Replay:
              description: Always "true"
              style: simple
            Location:
              description: "/api/v1/runs/{runId}"
              style: simple
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: New run queued
          headers:
            Location:
              description: "/api/v1/runs/{runId}"
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: validation-failed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found (project)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: idempotency-conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "unknown-suite, engine-not-allowed or fixture-not-allowed"
      summary: Create a run (idempotent by idempotencyKey)
      tags:
      - runs
  /api/v1/projects/{projectId}/suites:
    get:
      operationId: listSuites
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSuite"
          description: Suites
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found
      summary: Current revision of each suite in the manifest
      tags:
      - catalog
  /api/v1/runs:
    get:
      description: "Keyset-paginated: pass nextCursor back as cursor, with the same\
        \ filters. Null on the last page. Repeat status or trigger to match any of\
        \ several values; different filters must all match."
      operationId: listRuns
      parameters:
      - description: "1-100, default 20"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - description: Opaque; from a previous page's nextCursor
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Defaults to the caller's project
        in: query
        name: projectId
        required: false
        schema:
          type: string
          format: uuid
      - description: Aggregate run status; repeat for several
        in: query
        name: status
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - QUEUED
            - RUNNING
            - PASSED
            - FAILED
            - TIMED_OUT
            - INFRA_ERROR
            - CANCELLED
      - description: "Exact suite key, any revision"
        in: query
        name: suiteKey
        required: false
        schema:
          type: string
      - description: Exact branch name
        in: query
        name: branch
        required: false
        schema:
          type: string
      - description: Repeat for several
        in: query
        name: trigger
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - MANUAL
            - CI
            - RERUN
            - BENCHMARK
            - CHAOS
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageRunSummary"
          description: A page of runs
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "validation-failed (limit, cursor or a filter)"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found (projectId outside the caller's scope)
      summary: "List runs, newest first"
      tags:
      - runs
  /api/v1/runs/{runId}:
    get:
      operationId: getRun
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: The run
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found
      summary: A run with its targets and aggregate status
      tags:
      - runs
  /api/v1/runs/{runId}/cancel:
    post:
      description: QUEUED targets end CANCELLED immediately; active attempts are told
        on their next heartbeat and finish CANCELLED unless their completion commits
        first. A run that is already terminal is returned unchanged with 200.
      operationId: cancelRun
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: "Already terminal: nothing changed"
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: Cancel accepted
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found
      summary: Cancel a run
      tags:
      - runs
  /api/v1/runs/{runId}/events:
    get:
      description: "Each event: id = eventId, event = type, data = the contracts Â§\
        5 envelope. Send Last-Event-ID to resume; without it, the first event is RESYNC."
      operationId: streamRunEvents
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      - description: The last event id received; resume after it
        in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
          description: The event stream
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: validation-failed (Last-Event-ID is not a non-negative integer)
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "rate-limited: too many open streams; see Retry-After"
      summary: Server-sent events for one run
      tags:
      - runs
  /api/v1/runs/{runId}/rerun:
    post:
      description: "The new run has trigger RERUN and parentRunId set, and copies\
        \ the old run's suite revision, fixture and source. FAILED_TARGETS takes the\
        \ targets that ended FAILED, TIMED_OUT or INFRA_ERROR."
      operationId: rerunRun
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerunRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: "Replay: this key was already used with the same request"
          headers:
            Idempotent-Replay:
              description: Always "true"
              style: simple
            Location:
              description: "/api/v1/runs/{runId}"
              style: simple
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: New linked run queued
          headers:
            Location:
              description: "/api/v1/runs/{runId}"
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: validation-failed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: idempotency-conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "invalid-rerun (run not finished, or no failed targets), unknown-suite\
            \ (revision no longer current) or fixture-not-allowed"
      summary: "Rerun a finished run's failed targets, or all of them"
      tags:
      - runs
  /api/v1/runs/{runId}/results:
    get:
      operationId: getRunResults
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResults"
          description: The results
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found
      summary: "Every attempt per target with its case results, newest attempt first"
      tags:
      - runs
  /api/v1/runs/{runId}/timeline:
    get:
      description: "Attempts are oldest first. A gap is a silence longer than gapThresholdMs\
        \ (2 Ã the heartbeat interval) between the claim, the start, heartbeats and\
        \ the end; an unfinished attempt ends at serverNow, so a dead worker's silence\
        \ keeps growing until the reaper abandons the attempt."
      operationId: getRunTimeline
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTimeline"
          description: The timeline
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found
      summary: "The run's events grouped by target and attempt, with heartbeat gaps"
      tags:
      - runs
  /api/v1/suites/{suiteId}:
    get:
      operationId: getSuite
      parameters:
      - in: path
        name: suiteId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuiteDetail"
          description: The suite
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: not-found
      summary: One suite revision with its cases
      tags:
      - catalog
  /api/v1/workers:
    get:
      description: "Live workers (ACTIVE, DRAINING) and those LOST in the last hour."
      operationId: listWorkers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkersResponse"
          description: The registry
      summary: Worker registry and slot usage
      tags:
      - workers
components:
  schemas:
    ArtifactView:
      type: object
      properties:
        attemptId:
          type: string
          format: uuid
        byteSize:
          type: integer
          format: int64
        caseKey:
          type:
          - string
          - "null"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - SCREENSHOT
          - TRACE
          - LOG
        mime:
          type: string
        sha256:
          type: string
        state:
          type: string
          enum:
          - AVAILABLE
          - EXPIRED
          - MISSING
          - PURGED
      required:
      - attemptId
      - byteSize
      - caseKey
      - createdAt
      - expiresAt
      - id
      - kind
      - mime
      - sha256
      - state
    AttemptResults:
      type: object
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactView"
        attempt:
          $ref: "#/components/schemas/AttemptSummary"
        caseResults:
          type: array
          items:
            $ref: "#/components/schemas/CaseResult"
        errorDetail:
          type:
          - string
          - "null"
      required:
      - artifacts
      - attempt
      - caseResults
      - errorDetail
    AttemptSummary:
      type: object
      properties:
        attemptNo:
          type: integer
          format: int32
        claimedAt:
          type: string
          format: date-time
        errorClass:
          type:
          - string
          - "null"
          enum:
          - ASSERTION
          - TEST_TIMEOUT
          - SELECTOR_NOT_FOUND
          - BROWSER_LAUNCH
          - WORKER_LOST
          - WORKER_SHUTDOWN
          - LEASE_EXPIRED
          - NETWORK
          - ARTIFACT_STORE
          - CONFIG
          - CANCELLED
          - UNKNOWN
        finishedAt:
          type:
          - string
          - "null"
          format: date-time
        id:
          type: string
          format: uuid
        lastHeartbeatAt:
          type:
          - string
          - "null"
          format: date-time
        leaseExpired:
          type: boolean
        leasedUntil:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - "null"
          format: date-time
        status:
          type: string
          enum:
          - CLAIMED
          - RUNNING
          - PASSED
          - FAILED
          - TIMED_OUT
          - INFRA_ERROR
          - CANCELLED
          - ABANDONED
        workerId:
          type: string
      required:
      - attemptNo
      - claimedAt
      - errorClass
      - finishedAt
      - id
      - lastHeartbeatAt
      - leaseExpired
      - leasedUntil
      - startedAt
      - status
      - workerId
    Capabilities:
      type: object
      properties:
        fixturesAllowed:
          type: boolean
      required:
      - fixturesAllowed
    CaseResult:
      type: object
      properties:
        caseKey:
          type: string
        durationMs:
          type: integer
          format: int32
        errorClass:
          type:
          - string
          - "null"
          enum:
          - ASSERTION
          - TEST_TIMEOUT
          - SELECTOR_NOT_FOUND
          - BROWSER_LAUNCH
          - WORKER_LOST
          - WORKER_SHUTDOWN
          - LEASE_EXPIRED
          - NETWORK
          - ARTIFACT_STORE
          - CONFIG
          - CANCELLED
          - UNKNOWN
        errorMessage:
          type:
          - string
          - "null"
        retryCount:
          type: integer
          format: int32
        startOffsetMs:
          type:
          - integer
          - "null"
          format: int32
        status:
          type: string
          enum:
          - PASSED
          - FAILED
          - TIMED_OUT
          - SKIPPED
          - FLAKY
      required:
      - caseKey
      - durationMs
      - errorClass
      - errorMessage
      - retryCount
      - startOffsetMs
      - status
    CreateRunRequest:
      type: object
      properties:
        fixture:
          $ref: "#/components/schemas/Fixture"
        idempotencyKey:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,200}$"
        sharding:
          $ref: "#/components/schemas/Sharding"
        source:
          $ref: "#/components/schemas/Source"
        suiteKey:
          type: string
          maxLength: 64
          minLength: 0
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetRequest"
          maxItems: 3
          minItems: 1
        trigger:
          type: string
          enum:
          - MANUAL
          - CI
          - RERUN
          - BENCHMARK
          - CHAOS
      required:
      - idempotencyKey
      - suiteKey
      - targets
      - trigger
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    Fixture:
      type: object
      properties:
        mode:
          type: string
          enum:
          - PASS
          - PRODUCT_DEFECT
          - AUTOMATION_FLAKE
          - SELECTOR_DRIFT
          - TIMEOUT
        seed:
          type: integer
          format: int32
          maximum: 2147483647
          minimum: 0
      required:
      - mode
      - seed
    HeartbeatGap:
      type: object
      properties:
        durationMs:
          type: integer
          format: int64
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      required:
      - durationMs
      - from
      - to
    Link:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        url:
          type: string
      required:
      - expiresAt
      - url
    PageProject:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - items
      - nextCursor
    PageRunSummary:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - items
      - nextCursor
    PageSuite:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Suite"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - items
      - nextCursor
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        detail:
          type: string
        errors:
          type: array
          description: Only present when specific fields were wrong
          items:
            $ref: "#/components/schemas/FieldError"
        instance:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        traceId:
          type: string
          description: "W3C trace ID, 32 hex characters"
        type:
          type: string
          description: "Absent (about:blank) only for HTTP errors outside the catalogue,\
            \ e.g. 405"
          example: https://testgrid.local/problems/validation-failed
      required:
      - detail
      - instance
      - status
      - title
      - traceId
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        links:
          $ref: "#/components/schemas/ResourceLinks"
        name:
          type: string
        slug:
          type: string
      required:
      - id
      - links
      - name
      - slug
    RerunRequest:
      type: object
      properties:
        idempotencyKey:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,200}$"
        scope:
          type: string
          enum:
