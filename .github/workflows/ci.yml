# PRD-01 FR-9: format, lint, typecheck, unit tests and the Chromium smoke spec.
# PRD-02 FR-9: contract drift check (api/openapi.yaml and the generated TS types).
# Least privilege: read-only token, no secrets used, every action pinned to a commit SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: check + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm through Corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable pnpm
          pnpm -v
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml
      - run: pnpm install --frozen-lockfile
      - name: make check (format, lint, typecheck)
        run: make check
      - name: make test (node:test, Vitest + ./mvnw verify)
        run: make test
      - name: Vocabulary check
        run: bash tools/vocab_check.sh
      - name: Contract drift check (OpenAPI spec and TypeScript types)
        run: make contracts-check

  smoke:
    name: compose up + Chromium smoke and worker e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm through Corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: make up (all services healthy)
        run: make up
      - name: Run survives an API restart (PRD-02 AC-1)
        run: make restart-check
      - name: Worker end-to-end on Chromium (PRD-03 E2E-001, AC-1, AC-2)
        run: make e2e
      - name: Install Chromium for Playwright
        run: pnpm --filter worker exec playwright install --with-deps chromium
      - name: make smoke (FIXTURE_MODE=PASS)
        run: make smoke
      - name: Fixture isolation (AC-3)
        run: make fixture-checks
      - name: Fixtures disabled → 404 (AC-4)
        run: |
          DEMO_SHOP_FIXTURES=disabled docker compose -f infra/compose/compose.yaml --env-file .env up -d --wait demo-shop
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{"mode":"PRODUCT_DEFECT","seed":1}' http://127.0.0.1:4173/__fixture/session)
          echo "POST /__fixture/session with fixtures disabled -> $code"
          test "$code" = 404
      - name: Service logs
        if: failure()
        run: docker compose -f infra/compose/compose.yaml --env-file .env logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: worker/playwright-report
          retention-days: 7
      - name: make down
        if: always()
        run: make down
